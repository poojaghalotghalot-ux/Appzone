<!DOCTYPE html>
<html lang="hi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppZone v50.0 - Play Store Direct APK Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        playGreen: '#01875f',
                        playGreenHover: '#016c4c',
                        softBg: '#f8f9fa'
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff; color: #202124; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white min-h-screen pb-16">

    <!-- Play Store Style Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 px-4 lg:px-8 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <!-- App Logo -->
            <div class="flex items-center space-x-3 cursor-pointer shrink-0" onclick="filterCategory('all', null)">
                <div class="w-10 h-10 rounded-xl bg-playGreen flex items-center justify-center text-white text-xl font-bold shadow-md">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                </div>
                <div>
                    <span class="text-2xl font-bold tracking-tight text-gray-800">App<span class="text-playGreen">Zone</span></span>
                    <span class="bg-emerald-100 text-playGreen text-[10px] font-extrabold px-1.5 py-0.5 rounded ml-1">v50.0</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl">
                <div class="relative">
                    <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search 100+ Apps (VidMate, MX Player, BGMI, WhatsApp)..." class="w-full pl-11 pr-10 py-2.5 text-sm bg-gray-100 hover:bg-gray-200/80 focus:bg-white text-gray-900 rounded-full focus:outline-none focus:ring-2 focus:ring-playGreen border border-transparent focus:border-playGreen transition duration-200">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="openUploadModal()" class="shrink-0 bg-playGreen hover:bg-playGreenHover text-white px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition shadow flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">Add Custom APK</span>
            </button>
        </div>
    </header>

    <!-- Bucket Navigation Tabs -->
    <nav class="border-b border-gray-100 bg-white sticky top-[62px] z-40">
        <div class="max-w-7xl mx-auto px-4 flex items-center space-x-8 overflow-x-auto no-scrollbar py-3 text-sm font-semibold text-gray-600">
            <button onclick="filterCategory('all', this)" class="cat-tab text-playGreen border-b-2 border-playGreen pb-1 whitespace-nowrap">Home & Top Choice</button>
            <button onclick="filterCategory('daily', this)" class="cat-tab hover:text-playGreen pb-1 whitespace-nowrap">Daily Use Apps</button>
            <button onclick="filterCategory('games', this)" class="cat-tab hover:text-playGreen pb-1 whitespace-nowrap">Games Bucket</button>
            <button onclick="filterCategory('social', this)" class="cat-tab hover:text-playGreen pb-1 whitespace-nowrap">Social & Media</button>
            <button onclick="filterCategory('tools', this)" class="cat-tab hover:text-playGreen pb-1 whitespace-nowrap">Tools & Utility</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 lg:px-8 py-6">

        <!-- Top Featured Banner -->
        <section class="mb-8">
            <div class="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-800 rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
                <div class="relative z-10 max-w-xl">
                    <span class="bg-white/20 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">PlayZone Top Pick</span>
                    <h1 class="text-2xl sm:text-4xl font-extrabold mt-2 mb-2">VidMate & MX Player HD</h1>
                    <p class="text-xs sm:text-sm text-emerald-100 mb-5">Download videos, play HD music, and stream media instantly with fast verified APKs.</p>
                    <button onclick="openAppDetails(1)" class="bg-white text-emerald-800 hover:bg-emerald-50 text-xs sm:text-sm font-bold px-5 py-2.5 rounded-full transition shadow">
                        Get APK File
                    </button>
                </div>
                <i class="fa-solid fa-cloud-arrow-down absolute right-6 -bottom-4 text-white/10 text-9xl pointer-events-none"></i>
            </div>
        </section>

        <!-- Header Controls -->
        <div class="flex items-center justify-between mb-4">
            <h2 id="bucketTitle" class="text-xl font-bold text-gray-900">Popular Apps & Games Collection</h2>
            <span id="appCounter" class="text-xs text-gray-500 font-medium"></span>
        </div>

        <!-- 100+ Grid Section -->
        <div id="appsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Dynamic Apps Loaded via JS -->
        </div>

    </main>

    <!-- App Detail Modal -->
    <div id="appModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative border border-gray-100">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-700 text-xl w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-start space-x-4 mb-4">
                <img id="modalIcon" src="" class="w-20 h-20 rounded-2xl object-cover shadow border border-gray-100 shrink-0">
                <div>
                    <h3 id="modalTitle" class="text-lg font-bold text-gray-900 leading-snug"></h3>
                    <span id="modalCategory" class="inline-block text-[10px] bg-emerald-100 text-playGreen font-bold px-2 py-0.5 rounded uppercase mt-1"></span>
                    <div class="flex items-center space-x-3 mt-2 text-xs text-gray-500">
                        <span><i class="fa-solid fa-star text-amber-400"></i> <span id="modalRating"></span></span>
                        <span>•</span>
                        <span id="modalSize"></span>
                    </div>
                </div>
            </div>

            <!-- Security Badge -->
            <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-4 flex items-center space-x-2 text-xs text-emerald-800">
                <i class="fa-solid fa-shield-halved text-playGreen text-base shrink-0"></i>
                <span><strong>Play Protect Verified:</strong> Clean & malware-free APK link.</span>
            </div>

            <p id="modalDesc" class="text-xs text-gray-600 mb-6 leading-relaxed line-clamp-3"></p>

            <a id="modalDownloadBtn" href="#" target="_blank" download class="w-full bg-playGreen hover:bg-playGreenHover text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2 shadow-lg transition">
                <i class="fa-solid fa-download"></i>
                <span>Direct Download APK</span>
            </a>
        </div>
    </div>

    <!-- Upload Custom App Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold mb-4 text-gray-900">Add New App / Game</h3>
            <form onsubmit="handleNewApp(event)" class="space-y-3">
                <input type="text" id="newTitle" placeholder="App/Game Title" required class="w-full px-4 py-2 text-sm bg-gray-50 border rounded-xl">
                <select id="newCategory" class="w-full px-4 py-2 text-sm bg-gray-50 border rounded-xl">
                    <option value="daily">Daily Use Apps</option>
                    <option value="games">Games Bucket</option>
                    <option value="social">Social & Media</option>
                    <option value="tools">Tools & Utility</option>
                </select>
                <input type="text" id="newIcon" placeholder="Icon Image URL" required class="w-full px-4 py-2 text-sm bg-gray-50 border rounded-xl">
                <input type="text" id="newLink" placeholder="APK Download Link" required class="w-full px-4 py-2 text-sm bg-gray-50 border rounded-xl">
                <input type="text" id="newSize" placeholder="File Size (e.g. 25 MB)" required class="w-full px-4 py-2 text-sm bg-gray-50 border rounded-xl">
                <textarea id="newDesc" placeholder="App Description" required class="w-full px-4 py-2 text-sm bg-gray-50 border rounded-xl h-16"></textarea>
                <button type="submit" class="w-full bg-playGreen text-white font-bold py-2.5 rounded-xl">Publish App</button>
            </form>
        </div>
    </div>

    <script>
        // Core Database with Daily Use Apps, Games, and Auto 100+ App Generator
        const baseApps = [
            { id: 1, title: "VidMate HD Video Downloader", category: "daily", rating: "4.8", size: "19.5 MB", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Vidmate_logo.png/600px-Vidmate_logo.png", url: "https://vidmate.en.uptodown.com/android/download", desc: "Download HD videos and MP3 music from video platforms fast and easy." },
            { id: 2, title: "MX Player HD", category: "daily", rating: "4.6", size: "42.0 MB", icon: "https://play-lh.googleusercontent.com/48mC4u6q6f4XNf6_C2O-0qJkR2I34Gf4J1lZ=w240-h360-rw", url: "https://mx-player.en.uptodown.com/android/download", desc: "Powerful video player with hardware acceleration and subtitle support." },
            { id: 3, title: "SnapTube Video & Music", category: "daily", rating: "4.7", size: "24.1 MB", icon: "https://upload.wikimedia.org/wikipedia/commons/e/e0/Snaptube_logo.png", url: "https://snaptube.en.uptodown.com/android/download", desc: "Fast MP3 and video downloader for mobile devices." },
            { id: 4, title: "WhatsApp Messenger", category: "daily", rating: "4.5", size: "48.2 MB", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/512px-WhatsApp.svg.png", url: "https://www.whatsapp.com/android/current/WhatsApp.apk", desc: "Official direct APK file for WhatsApp messaging and video calls." },
            { id: 5, title: "PhonePe UPI Payments", category: "daily", rating: "4.5", size: "52.0 MB", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/PhonePe_Logo.svg/512px-PhonePe_Logo.svg.png", url: "https://phonepe.en.uptodown.com/android/download", desc: "Recharge, money transfer, and bill payments using UPI." },
            { id: 6, title: "Paytm Secure UPI", category: "daily", rating: "4.4", size: "65.0 MB", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Paytm_Logo.svg/512px-Paytm_Logo.svg.png", url: "https://paytm.en.uptodown.com/android/download", desc: "Instant UPI payments, mobile recharge, and online wallet." },
            { id: 7, title: "Truecaller Caller ID", category: "tools", rating: "4.5", size: "42.0 MB", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Truecaller_logo.svg/512px-Truecaller_logo.svg.png", url: "https://truecaller.en.uptodown.com/android/download", desc: "Identify unknown callers and block spam calls automatically." },
            { id: 8, title: "BGMI (Battlegrounds Mobile India)", category: "games", rating: "4.6", size: "850 MB", icon: "https://play-lh.googleusercontent.com/48mC4u6q6f4XNf6_C2O-0qJkR2I34Gf4J1lZ=w240-h360-rw", url: "https://pubg-mobile.en.uptodown.com/android/download", desc: "India's favorite battle royale action game." },
            { id: 9, title: "Free Fire MAX", category: "games", rating: "4.4", size: "620 MB", icon: "https://play-lh.googleusercontent.com/L_2G6O_dJ9eS1X5=w240-h360-rw", url: "https://garena-free-fire-max.en.uptodown.com/android/download", desc: "High quality battle royale game with HD visuals." },
            { id: 10, title: "Ludo King", category: "games", rating: "4.5", size: "68 MB", icon: "https://play-lh.googleusercontent.com/Ludo_King_Icon=w240-h360-rw", url: "https://ludo-king.en.uptodown.com/android/download", desc: "Play Ludo online with friends and family." },
            { id: 11, title: "Subway Surfers", category: "games", rating: "4.7", size: "135 MB", icon: "https://play-lh.googleusercontent.com/graphics/subway-surfers-logo.png", url: "https://subway-surfers.en.uptodown.com/android/download", desc: "Run, jump, and dodge oncoming trains in subway tracks." },
            { id: 12, title: "Instagram", category: "social", rating: "4.3", size: "54.0 MB", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/600px-Instagram_icon.png", url: "https://instagram.en.uptodown.com/android/download", desc: "Share reels, photos, and stories with friends." },
            { id: 13, title: "ChatGPT AI Assistant", category: "tools", rating: "4.8", size: "28.0 MB", icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/ChatGPT_logo.svg/512px-ChatGPT_logo.svg.png", url: "https://chatgpt.en.uptodown.com/android/download", desc: "Smart AI assistant for instant answers and help." }
        ];

        // Generate 100+ Total Apps automatically
        let generatedDB = [];
        for (let i = 1; i <= 108; i++) {
            let item = baseApps[(i - 1) % baseApps.length];
            let suffix = i > baseApps.length ? ` Pro v${Math.floor(i/10)+1}.0` : "";
            
            generatedDB.push({
                id: i,
                title: item.title + suffix,
                category: item.category,
                rating: (4.2 + (i % 8) * 0.1).toFixed(1),
                size: item.size,
                icon: item.icon,
                downloadUrl: item.url,
                desc: item.desc
            });
        }

        let apps = JSON.parse(localStorage.getItem('appzone_full_extreme_db')) || generatedDB;

        function renderApps(list = apps) {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            document.getElementById('appCounter').innerText = `Total: ${list.length} Apps & Games`;

            list.forEach(app => {
                grid.innerHTML += `
                    <div onclick="openAppDetails(${app.id})" class="cursor-pointer bg-white p-3 rounded-2xl border border-gray-100 hover:border-playGreen hover:shadow-lg transition flex flex-col justify-between group">
                        <div>
                            <img src="${app.icon}" class="w-full aspect-square rounded-2xl object-cover shadow-sm mb-2 group-hover:scale-105 transition" onerror="this.src='https://via.placeholder.com/150'">
                            <h3 class="font-bold text-xs text-gray-900 line-clamp-1 group-hover:text-playGreen">${app.title}</h3>
                            <span class="text-[10px] text-gray-400 capitalize block mt-0.5">${app.category} Bucket</span>
                        </div>
                        <div class="mt-3 flex items-center justify-between text-[11px]">
                            <span class="text-amber-500 font-bold"><i class="fa-solid fa-star text-[10px]"></i> ${app.rating}</span>
                            <span class="bg-emerald-50 text-playGreen font-bold px-2 py-0.5 rounded text-[10px]">Get APK</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-tab').forEach(b => {
                b.classList.remove('text-playGreen', 'border-b-2', 'border-playGreen');
            });
            if(btn) btn.classList.add('text-playGreen', 'border-b-2', 'border-playGreen');

            if (cat === 'all') {
                renderApps(apps);
            } else {
                renderApps(apps.filter(a => a.category === cat));
            }
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = apps.filter(a => a.title.toLowerCase().includes(q) || a.category.toLowerCase().includes(q));
            renderApps(filtered);
        }

        function openAppDetails(id) {
            const app = apps.find(a => a.id === id);
            if (!app) return;

            document.getElementById('modalIcon').src = app.icon;
            document.getElementById('modalTitle').innerText = app.title;
            document.getElementById('modalCategory').innerText = app.category + " Bucket";
            document.getElementById('modalRating').innerText = app.rating;
            document.getElementById('modalSize').innerText = app.size;
            document.getElementById('modalDesc').innerText = app.desc;
            document.getElementById('modalDownloadBtn').href = app.downloadUrl;

            document.getElementById('appModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('appModal').classList.add('hidden'); }
        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

        function handleNewApp(e) {
            e.preventDefault();
            const newApp = {
                id: Date.now(),
                title: document.getElementById('newTitle').value,
                category: document.getElementById('newCategory').value,
                rating: "4.9",
                size: document.getElementById('newSize').value,
                icon: document.getElementById('newIcon').value,
                downloadUrl: document.getElementById('newLink').value,
                desc: document.getElementById('newDesc').value
            };

            apps.unshift(newApp);
            localStorage.setItem('appzone_full_extreme_db', JSON.stringify(apps));
            renderApps();
            closeUploadModal();
            e.target.reset();
        }

        // Initialize Store
        renderApps();
    </script>
</body>
</html>
